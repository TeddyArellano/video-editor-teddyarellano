<title>__TITULO__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Sala de revisión: el video vertical manda a la izquierda; a la derecha, el carril de notas con código de tiempo (30 fps). */
:root {
  --bg: #eef0f3; --panel: #ffffff; --ink: #14171c; --muted: #5c6470; --line: #d5d9e0;
  --tally: #d93a3f; --tally-soft: #fbe3e3; --ok: #1f8a5b; --ok-soft: #dcf2e7; --screen: #0b0d10;
  --f-ui: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-tc: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --panel: #191d23; --ink: #e9ecf1; --muted: #9aa3af; --line: #2b313a;
  --tally: #ff5a5f; --tally-soft: #3a1e21; --ok: #4cc38a; --ok-soft: #173326; --screen: #000; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111418; --panel: #191d23; --ink: #e9ecf1; --muted: #9aa3af; --line: #2b313a;
  --tally: #ff5a5f; --tally-soft: #3a1e21; --ok: #4cc38a; --ok-soft: #173326; --screen: #000; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.stage { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 760px) { .stage { position: static; } }
.phone { background: var(--screen); border-radius: 22px; padding: 8px; aspect-ratio: 9 / 16; max-width: 100%; max-height: 78vh; margin-inline: auto; display: grid; }
.phone video { width: 100%; height: 100%; border-radius: 15px; object-fit: contain; background: var(--screen); }
.phone .novideo { color: #9aa3af; display: grid; place-items: center; text-align: center; padding: 24px; font-size: 14px; }
.tc { font-family: var(--f-tc); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.transport { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); }
.transport .tc { color: var(--ink); font-size: 15px; font-weight: 700; }
.timeline { position: relative; height: 26px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
.timeline .play { position: absolute; top: 0; bottom: 0; left: 0; background: var(--line); border-radius: 5px 0 0 5px; pointer-events: none; }
.timeline .mk { position: absolute; top: 3px; bottom: 3px; width: 3px; margin-left: -1px; border-radius: 2px; background: var(--tally); }
.timeline .mk.done { background: var(--ok); }
header h1 { font-size: 26px; line-height: 1.15; margin: 0; text-wrap: balance; font-weight: 700; }
header p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; line-height: 1.45; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.rec { color: var(--tally); border-color: var(--tally); }
.panel { display: grid; gap: 18px; min-width: 0; }
.composer { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.composer .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.composer label { font-weight: 600; }
.stamp { background: var(--tally-soft); color: var(--tally); border-radius: 6px; padding: 3px 8px; font-weight: 700; }
textarea { width: 100%; min-height: 76px; resize: vertical; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px 12px; font: inherit; line-height: 1.4; }
textarea:focus-visible, button:focus-visible { outline: 2px solid var(--tally); outline-offset: 2px; }
button { font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; cursor: pointer; }
button.primary { background: var(--tally); border-color: var(--tally); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.hint { color: var(--muted); font-size: 13px; }
.list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.list h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.note { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.note .when { background: none; border: 0; padding: 0; color: var(--tally); font-weight: 700; align-self: start; }
.note.done .when { color: var(--ok); }
.note .txt { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
.note .meta { grid-column: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.state { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border-radius: 99px; padding: 2px 8px; background: var(--tally-soft); color: var(--tally); font-weight: 700; }
.state.done { background: var(--ok-soft); color: var(--ok); }
.reply { grid-column: 2; color: var(--muted); font-size: 14px; border-left: 2px solid var(--ok); padding-left: 10px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-weight: 500; }
.empty { color: var(--muted); padding: 18px 0; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script type="application/json" id="cfg">__CFG__</script>

<main class="wrap">
  <section class="stage" aria-label="Video">
    <div class="phone" id="phone"></div>
    <div class="transport"><span class="tc" id="tc">00:00:00</span><span id="dur" class="tc"></span></div>
    <div class="timeline" id="timeline" role="slider" aria-label="Línea de tiempo" tabindex="0"><div class="play" id="play"></div></div>
  </section>

  <section class="panel">
    <header>
      <h1 id="titulo"></h1>
      <p id="nota"></p>
      <div class="chips"><span class="chip rec" id="ver"></span><span class="chip" id="cuenta">0 notas</span></div>
    </header>

    <form class="composer" id="form">
      <div class="row">
        <label for="texto">Nota en</label>
        <span class="stamp tc" id="stamp">00:00:00</span>
        <button type="button" id="usar">Usar el momento actual</button>
      </div>
      <textarea id="texto" placeholder="Qué cambiar en este momento (ej. «quita esta frase», «zoom al objeto», «el texto tapa la cara»)"></textarea>
      <div class="row">
        <button class="primary" type="submit" id="enviar">Agregar nota</button>
        <span class="hint" id="estado">Pausa el video donde quieras comentar.</span>
      </div>
    </form>

    <div class="list" aria-live="polite">
      <h2>Notas por tiempo</h2>
      <div id="notas"><p class="empty">Todavía no hay notas. Pausa el video en el momento exacto, escribe qué cambiar y pulsa «Agregar nota». Claude las lee en orden y marca cada una como aplicada.</p></div>
    </div>
  </section>
</main>

<script>
(() => {
  const CFG = JSON.parse(document.getElementById('cfg').textContent);
  const FPS = CFG.fps || 30;
  const $ = (id) => document.getElementById(id);
  const tcode = (t) => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = Math.floor(t % 60), f = Math.floor((t % 1) * FPS);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`; };
  $('titulo').textContent = CFG.titulo;
  $('nota').textContent = CFG.nota || 'Borrador para revisar. Las notas quedan guardadas con su código de tiempo (minutos:segundos:cuadros).';
  $('ver').textContent = `versión ${CFG.version}`;

  // ---- video
  let video = null, stampT = 0, notes = [];
  if (CFG.video_url && !CFG.video_url.startsWith('__')) {
    video = document.createElement('video');
    Object.assign(video, {src: CFG.video_url, controls: true, playsInline: true, preload: 'metadata'});
    $('phone').appendChild(video);
  } else {
    $('phone').innerHTML = '<div class="novideo">El borrador se está subiendo. Recarga en un momento.</div>';
  }
  const dur = () => (video && isFinite(video.duration) ? video.duration : CFG.duracion || 0);
  const tick = () => {
    const t = video ? video.currentTime : 0;
    $('tc').textContent = tcode(t);
    $('play').style.width = dur() ? `${(t / dur()) * 100}%` : '0';
  };
  const setStamp = (t) => { stampT = Math.round(t * 100) / 100; $('stamp').textContent = tcode(stampT); };
  if (video) {
    video.addEventListener('timeupdate', tick);
    video.addEventListener('loadedmetadata', () => { $('dur').textContent = tcode(dur()); renderMarks(); });
    video.addEventListener('pause', () => setStamp(video.currentTime));
    video.addEventListener('seeked', () => { if (video.paused) setStamp(video.currentTime); tick(); });
  }
  $('dur').textContent = CFG.duracion ? tcode(CFG.duracion) : '';
  const seek = (t) => { if (!video) return; video.currentTime = t; video.pause(); setStamp(t); };
  $('usar').addEventListener('click', () => setStamp(video ? video.currentTime : 0));
  const tl = $('timeline');
  tl.addEventListener('click', (e) => { const r = tl.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * dur()); });
  tl.addEventListener('keydown', (e) => { if (!video) return;
    if (e.key === 'ArrowRight') seek(Math.min(dur(), video.currentTime + 1 / FPS * (e.shiftKey ? FPS : 1)));
    if (e.key === 'ArrowLeft') seek(Math.max(0, video.currentTime - 1 / FPS * (e.shiftKey ? FPS : 1))); });

  // ---- notas (db)
  let db = null, user = null, me = null;
  const renderMarks = () => {
    tl.querySelectorAll('.mk').forEach((m) => m.remove());
    if (!dur()) return;
    for (const n of notes) {
      const m = document.createElement('div');
      m.className = 'mk' + (n.estado === 'aplicado' ? ' done' : '');
      m.style.left = `${(n.t / dur()) * 100}%`;
      m.title = `${tcode(n.t)} · ${n.texto}`;
      tl.appendChild(m);
    }
  };
  const renderNotes = async () => {
    $('cuenta').textContent = `${notes.length} ${notes.length === 1 ? 'nota' : 'notas'}`;
    const box = $('notas');
    if (!notes.length) { box.innerHTML = '<p class="empty">Todavía no hay notas. Pausa el video en el momento exacto, escribe qué cambiar y pulsa «Agregar nota». Claude las lee en orden y marca cada una como aplicada.</p>'; renderMarks(); return; }
    const ids = [...new Set(notes.map((n) => n.autor).filter(Boolean))];
    let ps = {};
    try { ps = user && ids.length ? await user.profiles(ids) : {}; } catch (_) {}
    box.textContent = '';
    for (const n of notes) {
      const done = n.estado === 'aplicado';
      const row = document.createElement('div'); row.className = 'note' + (done ? ' done' : '');
      const when = document.createElement('button'); when.type = 'button'; when.className = 'when tc'; when.textContent = tcode(n.t);
      when.addEventListener('click', () => seek(n.t));
      const txt = document.createElement('div'); txt.className = 'txt'; txt.textContent = n.texto;
      const meta = document.createElement('div'); meta.className = 'meta';
      const st = document.createElement('span'); st.className = 'state' + (done ? ' done' : ''); st.textContent = done ? 'aplicada' : 'pendiente';
      const who = document.createElement('span'); who.textContent = (ps[n.autor] && ps[n.autor].name) || 'Alguien';
      const ver = document.createElement('span'); ver.textContent = `v${n.version || '?'}`;
      meta.append(st, who, ver);
      if (me && n.autor === me && !done) {
        const del = document.createElement('button'); del.type = 'button'; del.className = 'linkbtn'; del.textContent = 'Borrar';
        del.addEventListener('click', async () => { del.disabled = true; try { await db.collection('comentarios').doc(n.id).delete(); } catch (e) { del.disabled = false; $('estado').textContent = 'No se pudo borrar la nota. Intenta de nuevo.'; } });
        meta.append(del);
      }
      row.append(when, txt, meta);
      if (n.respuesta) { const r = document.createElement('div'); r.className = 'reply'; r.textContent = n.respuesta; row.append(r); }
      box.append(row);
    }
    renderMarks();
  };

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const texto = $('texto').value.trim();
    if (!texto) { $('estado').textContent = 'Escribe qué cambiar antes de agregar la nota.'; return; }
    if (!db) { $('estado').textContent = 'Inicia sesión en claude.ai para guardar notas.'; return; }
    $('enviar').disabled = true;
    try {
      await db.collection('comentarios').add({t: stampT, texto, autor: me, creado: Date.now(), version: CFG.version, estado: 'pendiente'});
      $('texto').value = ''; $('estado').textContent = `Nota guardada en ${tcode(stampT)}.`;
    } catch (err) {
      $('estado').textContent = err && err.code === 'not_granted' ? 'Tu acceso es de solo lectura: pide permiso de edición para dejar notas.' : 'No se pudo guardar la nota. Revisa tu conexión e intenta de nuevo.';
    } finally { $('enviar').disabled = false; }
  });

  (async () => {
    const use = (n) => (window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null));
    db = await use('db');
    user = await use('user');
    if (user) { try { me = await user.id(); } catch (_) {} }
    if (!db) { $('estado').textContent = 'Las notas se guardan al abrir esta página con sesión en claude.ai.'; return; }
    db.collection('comentarios').orderBy('t').onSnapshot((snap) => {
      notes = snap.docs.map((d) => ({id: d.id, ...d.data()}));
      renderNotes();
    }, () => { $('estado').textContent = 'Se perdió la conexión con las notas. Recarga la página.'; });
  })();
})();
</script>
